name: AI Safety Regression

# Runs the fixed set of AI-behavior tests from plan §20 on every PR and on
# a nightly schedule so we catch silent behavior drift after provider swaps.

on:
  push:
    branches: [main]
    paths:
      - "backend/app/services/safety/**"
      - "backend/app/services/ai/**"
      - "backend/tests/test_safety*.py"
      - "backend/tests/test_llm_router.py"
      - "backend/tests/test_chat_safety_integration.py"
      - ".github/workflows/ai-regression.yml"
  pull_request:
    paths:
      - "backend/app/services/safety/**"
      - "backend/app/services/ai/**"
      - "backend/tests/test_safety*.py"
      - "backend/tests/test_llm_router.py"
      - "backend/tests/test_chat_safety_integration.py"
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily

jobs:
  safety:
    name: Safety + LLM router regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run AI safety + router regression suite
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./ai_ci.db
          JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-chars-long
          JWT_REFRESH_SECRET: ci-only-refresh-secret-that-is-at-least-32-chars-long
        run: |
          pytest -q \
            tests/test_safety.py \
            tests/test_safety_extra.py \
            tests/test_llm_router.py \
            tests/test_chat_safety_integration.py \
            tests/test_failures.py
